[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-lab"
version = "0.1.0"
description = "Simulador modular de algoritmos de enrutamiento para CC3067"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Ihan-Marroquin", email = "ihanmarroquin12@gmail.com"},
]
dependencies = []

[project.scripts]
routing-lab = "routing_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

